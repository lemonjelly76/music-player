spring.application.name=music-player

# The day boundary for "added on" dates and playlist descriptions
app.zone=Europe/London

# ADR-011: the household login for the app's API and /mcp
app.security.username=${APP_USERNAME:}
app.security.password=${APP_PASSWORD:}
# ADR-011: optional bearer token for /mcp, sent by a claude.ai custom connector
app.security.mcp-token=${MCP_TOKEN:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/music_player}
spring.datasource.username=music_player
spring.datasource.password=${POSTGRES_PASSWORD:}

# A hung upstream fails the call instead of blocking it forever
spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=30s

# ADR-006 and ADR-008: Tidal, the preferred service. Register an app at developer.tidal.com with the redirect URI.
tidal.api-url=https://openapi.tidal.com/v2
tidal.country-code=${TIDAL_COUNTRY_CODE:GB}
tidal.web-url=https://tidal.com/browse
tidal.oauth.authorize-url=https://login.tidal.com/authorize
tidal.oauth.token-url=https://auth.tidal.com/v1/oauth2/token
tidal.oauth.client-id=${TIDAL_CLIENT_ID:}
tidal.oauth.client-secret=${TIDAL_CLIENT_SECRET:}
tidal.oauth.redirect-uri=${PUBLIC_URL:}/api/connect/tidal/callback
tidal.oauth.scopes=user.read collection.read collection.write playlists.read playlists.write search.read

# ADR-006 and ADR-008: Spotify, the fallback. Register an app at developer.spotify.com with the redirect URI.
spotify.api-url=https://api.spotify.com/v1
spotify.market=${SPOTIFY_MARKET:GB}
spotify.web-url=https://open.spotify.com
spotify.oauth.authorize-url=https://accounts.spotify.com/authorize
spotify.oauth.token-url=https://accounts.spotify.com/api/token
spotify.oauth.client-id=${SPOTIFY_CLIENT_ID:}
spotify.oauth.client-secret=${SPOTIFY_CLIENT_SECRET:}
spotify.oauth.redirect-uri=${PUBLIC_URL:}/api/connect/spotify/callback
spotify.oauth.scopes=user-library-read user-library-modify playlist-modify-private playlist-modify-public user-read-recently-played

# ADR-009: Last.fm similarity and scrobbles; leave the key empty to leave Last.fm out
lastfm.api-url=https://ws.audioscrobbler.com/2.0/
lastfm.api-key=${LASTFM_API_KEY:}
lastfm.user-agent=music-player/0.1 (self-hosted)

# ADR-009: MusicBrainz asks for an app name and a contact
musicbrainz.api-url=https://musicbrainz.org/ws/2
musicbrainz.user-agent=music-player/0.1 ( ${MUSICBRAINZ_CONTACT:https://github.com/lemonjelly76} )

# ADR-012: optional Lidarr for wanted albums
lidarr.url=${LIDARR_URL:}
lidarr.api-key=${LIDARR_API_KEY:}
lidarr.root-folder=${LIDARR_ROOT_FOLDER:/music}
lidarr.quality-profile-id=${LIDARR_QUALITY_PROFILE_ID:1}
lidarr.metadata-profile-id=${LIDARR_METADATA_PROFILE_ID:1}

# ADR-010: how often everyone's new plays are read
plays.interval=1h
plays.initial-delay=5m

# ADR-004: MCP server over Streamable HTTP at /mcp, behind the household login or the bearer token
spring.ai.mcp.server.name=music-player
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=You curate album libraries, recommend whole albums and make playlists for a household of up to \
  five people. Every call is about one person: use their name from list_people. You are the recommender; the server \
  gathers candidates, filters and ranks them, and checks that every pick is a real album their streaming service can \
  play. To recommend, read get_taste_profile and get_candidates, choose about 7 albums from the pool and up to 3 \
  wildcards of your own, give each a one-line reason tied to their taste, and save them with save_recommendations, \
  which keeps them as albums to try in their app. A playlist is different: single songs, not albums. To make one, \
  choose about 60 songs in play order and save them with save_playlist, which keeps the first 50 found and writes \
  them to their streaming service as an 'AI Picks' playlist. Never invent catalogue ids: use refs from the tools, \
  or 'Artist — Title' for wildcards. Songs are rated like albums: record what they think of a song with \
  rate_song, and read get_songs before a playlist. Ratings are love, ok or dislike, per activity (Running, Dinner...) or General: when someone says what \
  they think of an album or a pick, record it with rate_album for that activity, and when what you learn changes your \
  picture of their taste, rewrite it with update_taste_profile. If a playlist was saved but not synced, \
  sync_playlist retries it. Respect their 'never recommend' \
  rules and each category's rules. Play counts are only there when the person allows it; never ask them to turn \
  counting on.

# Charts: Apple Music's most played songs and albums, fetched daily; each person's chart playlist is written weekly
charts.url=https://rss.marketingtools.apple.com/api/v2
charts.country=${CHARTS_COUNTRY:gb}
charts.size=50
charts.check-interval=1h
charts.initial-delay=2m
charts.lookup-pause=500ms
